[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attention-router"
version = "1.0.0"
description = "Personalised notification triage for multimodal messaging — decides what interrupts you, what waits, and what gets suppressed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "rag", "retrieval", "classification", "notifications", "content-safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.40,<1.0",
]

[project.optional-dependencies]
# Voice transcription and the Groq router speak plain HTTP over the standard
# library, so neither needs a dependency of its own.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
synth = ["pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
attention-router = "attention_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "tests", "synth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
